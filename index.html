<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SportZone Pro — Live Cricket & Sports TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #060913;
      --surface: #0f1626;
      --card: #141d31;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00e676;
      --accent-glow: rgba(0, 230, 118, 0.25);
      --blue: #38bdf8;
      --live: #ff3b5c;
      --gold: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 76px; overflow-x: hidden; }

    /* Top App Bar */
    header {
      background: rgba(15, 22, 38, 0.9);
      backdrop-filter: blur(14px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #00e676, #00b0ff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #060913; font-size: 16px;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
    .brand-title span { color: var(--accent); }
    .lang-pill { display: flex; background: #090e1a; padding: 3px; border-radius: 20px; border: 1px solid var(--border); }
    .lbtn { background: transparent; border: none; color: var(--muted); padding: 4px 10px; border-radius: 16px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .lbtn.active { background: var(--accent); color: #060913; }

    /* Category Filter Pills */
    .filter-bar { display: flex; gap: 8px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .chip { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .chip.active { background: rgba(0, 230, 118, 0.14); border-color: var(--accent); color: var(--accent); }

    /* Container */
    .wrap { max-width: 760px; margin: auto; padding: 12px 16px; }
    .sec { display: none; animation: fadeIn 0.25s ease; }
    .sec.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Featured Horizontal Slider */
    .sec-head { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 12px; }
    .sec-head h3 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
    .slider { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .slider::-webkit-scrollbar { display: none; }

    /* Match Card */
    .m-card {
      background: linear-gradient(160deg, #162038 0%, #0f1626 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.18s;
      position: relative;
      overflow: hidden;
    }
    .slider .m-card { min-width: 295px; margin-bottom: 0; border-color: rgba(0, 230, 118, 0.25); }
    .m-card:active { transform: scale(0.985); }
    .m-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .live-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(255, 59, 92, 0.16); color: var(--live); padding: 3px 9px; border-radius: 20px; font-weight: 800; font-size: 10px; }
    .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.4); } 100% { opacity: 1; transform: scale(1); } }

    .team-row { display: flex; justify-content: space-between; align-items: center; margin: 9px 0; }
    .team-info { display: flex; align-items: center; gap: 10px; }
    .team-logo {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 11px; color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .team-name { font-size: 14px; font-weight: 700; }
    .team-score { font-size: 15px; font-weight: 800; color: #fff; }
    .team-score small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 4px; }
    .m-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .m-status { color: var(--gold); font-weight: 600; max-width: 72%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-cta { color: var(--accent); font-weight: 700; font-size: 11px; }

    /* Live TV Player & Grid */
    .tv-frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    video, iframe { width: 100%; height: 100%; border: none; }
    .ad-overlay { position: absolute; inset: 0; background: rgba(6, 9, 19, 0.96); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; text-align: center; }
    .ad-box-card { border: 1px dashed var(--accent); background: rgba(0, 230, 118, 0.06); padding: 20px 28px; border-radius: 14px; margin-bottom: 12px; }
    .search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 11px 14px; border-radius: 12px; font-size: 13px; margin: 12px 0; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .tv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .tv-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .tv-card.playing { border-color: var(--accent); background: rgba(0, 230, 118, 0.08); }
    .tv-cat { font-size: 10px; font-weight: 700; color: var(--blue); text-transform: uppercase; }
    .tv-title { font-size: 13px; font-weight: 700; margin-top: 6px; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
      background: rgba(15, 22, 38, 0.95); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 100;
    }
    .b-item { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; cursor: pointer; flex: 1; padding: 8px 0; }
    .b-item span.ico { font-size: 18px; }
    .b-item.active { color: var(--accent); }

    /* Fullscreen Match Center & Player Modals */
    .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; overflow-y: auto; }
    .sheet-head { background: var(--surface); padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .back-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; padding: 7px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .sub-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .sub-tab { flex: 1; padding: 12px; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 700; border-bottom: 2px solid transparent; cursor: pointer; }
    .sub-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; background: var(--surface); border-radius: 10px; overflow: hidden; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { background: rgba(255,255,255,0.04); color: var(--blue); font-weight: 700; }
    .p-link { color: var(--blue); font-weight: 700; cursor: pointer; }
    .modal-pop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; display: none; justify-content: center; align-items: center; padding: 16px; }
    .pop-card { background: var(--card); border: 1px solid var(--accent); border-radius: 18px; padding: 20px; width: 100%; max-width: 460px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-icon">SZ</div>
      <div class="brand-title">SportZone <span>Pro</span></div>
    </div>
    <div class="lang-pill">
      <button class="lbtn active" onclick="setLang('en', this)">EN</button>
      <button class="lbtn" onclick="setLang('bn', this)">বাংলা</button>
      <button class="lbtn" onclick="setLang('hi', this)">हिन्दी</button>
    </div>
  </header>

  <!-- MATCHES TAB -->
  <div id="tab-matches" class="sec active">
    <div class="filter-bar" id="formatBar">
      <button class="chip active" onclick="filterMatches('ALL', this)">All Matches</button>
      <button class="chip" onclick="filterMatches('T20', this)">T20 / Leagues</button>
      <button class="chip" onclick="filterMatches('ODI', this)">ODI</button>
      <button class="chip" onclick="filterMatches('TEST', this)">Test</button>
    </div>
    <div class="wrap">
      <div class="sec-head"><h3 id="lblFeatured">🔥 Featured Live</h3></div>
      <div class="slider" id="featuredSlider"></div>
      <div class="sec-head" style="margin-top:18px;"><h3 id="lblAll">🏏 Match Center</h3></div>
      <div id="matchFeed"></div>
    </div>
  </div>

  <!-- LIVE TV TAB -->
  <div id="tab-tv" class="sec">
    <div class="wrap">
      <div class="tv-frame">
        <div class="ad-overlay" id="adOverlay">
          <div class="ad-box-card">
            <div style="font-size:10px;color:var(--muted);letter-spacing:1px;">ADVERTISEMENT</div>
            <div style="font-size:16px;font-weight:800;color:var(--accent);margin-top:4px;">SPONSORED BANNER (300×100)</div>
          </div>
          <div style="font-size:13px;font-weight:700;color:#fff;">Stream starts in <span id="adTimer" style="color:var(--accent);">10</span>s...</div>
        </div>
        <video id="hlsPlayer" controls playsinline></video>
      </div>
      <div id="nowPlaying" style="margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);">📺 Tap any channel below to watch live</div>
      <input type="text" class="search-input" id="tvSearch" placeholder="🔍 Search sports channels (e.g. Dubai, FIFA, Red Bull)..." oninput="renderTv()">
      <div class="tv-grid" id="tvGrid"></div>
    </div>
  </div>

  <!-- VIDEOS TAB -->
  <div id="tab-videos" class="sec">
    <div class="wrap">
      <div class="tv-frame">
        <iframe id="ytFrame" src="https://www.youtube.com/embed/live_stream?channel=UCt2jxGk2fw704_7yX20r-2w" allowfullscreen></iframe>
      </div>
      <div class="sec-head" style="margin-top:16px;"><h3>🎬 Official Cricket Channels</h3></div>
      <div id="ytChannels"></div>
    </div>
  </div>

  <!-- MATCH DETAIL SHEET -->
  <div class="sheet" id="matchSheet">
    <div class="sheet-head">
      <button class="back-btn" onclick="closeSheet()">← Back</button>
      <div style="font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="sheetTitle">Match Center</div>
    </div>
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchSub('sub-sum', this)">Summary</button>
      <button class="sub-tab" onclick="switchSub('sub-sc', this)">Full Scorecard</button>
      <button class="sub-tab" onclick="switchSub('sub-info', this)">Match Info</button>
    </div>
    <div class="wrap" id="sheetBody"></div>
  </div>

  <!-- PLAYER STATS MODAL -->
  <div class="modal-pop" id="playerPop">
    <div class="pop-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="color:var(--accent);font-size:16px;" id="pName">Player Stats</h3>
        <button class="back-btn" onclick="document.getElementById('playerPop').style.display='none'">✕</button>
      </div>
      <div id="pBody"></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="b-item active" onclick="switchNav('tab-matches', this)"><span class="ico">🏏</span><span id="nav1">Matches</span></button>
    <button class="b-item" onclick="switchNav('tab-tv', this)"><span class="ico">📺</span><span id="nav2">Live TV</span></button>
    <button class="b-item" onclick="switchNav('tab-videos', this)"><span class="ico">🎬</span><span id="nav3">Videos</span></button>
  </nav>

  <script src="./app.js?v=1"></script>
</body>
</html>

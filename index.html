<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SportZone Pro - Live Cricket & TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#060913; --surface:#0f172a; --card:#151f34; --border:rgba(56,189,248,0.25); --green:#00e676; --blue:#38bdf8; --red:#ff3b5c; --gold:#fbbf24; --text:#f8fafc; --muted:#94a3b8; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Hind Siliguri','Noto Sans Devanagari',sans-serif; }
    body { background:radial-gradient(circle at top right,#111e3b 0%,#060913 60%); color:var(--text); padding-bottom:75px; min-height:100vh; }
    .overlay-modal { position:fixed; inset:0; background:rgba(6,9,19,0.96); z-index:5000; display:none; justify-content:center; align-items:center; padding:20px; }
    .modal-card { background:#16213a; border:1px solid var(--green); border-radius:20px; padding:24px; width:100%; max-width:380px; text-align:center; }
    .lang-btn { width:100%; padding:13px 16px; margin-top:10px; background:#1e293b; border:1px solid var(--border); border-radius:12px; color:#fff; font-size:16px; font-weight:700; cursor:pointer; display:flex; justify-content:space-between; }
    header { background:rgba(11,17,32,0.95); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
    .brand { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; color:var(--green); }
    .lang-switch { background:#1e293b; color:var(--blue); border:1px solid var(--border); padding:5px 12px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; }
    .main-nav { display:flex; background:var(--surface); padding:8px 12px; gap:8px; border-bottom:1px solid var(--border); position:sticky; top:53px; z-index:99; }
    .nav-btn { flex:1; padding:9px 6px; border:none; border-radius:10px; background:rgba(30,41,59,0.6); color:var(--muted); font-weight:700; font-size:13px; cursor:pointer; }
    .nav-btn.active { background:linear-gradient(135deg,var(--green),#059669); color:#000; }
    .container { padding:14px; max-width:780px; margin:auto; }
    .section { display:none; }
    .section.active { display:block; }
    .spotlight { background:linear-gradient(135deg,#1e1b4b,#361134,#0f172a); border:1px solid rgba(255,59,92,0.45); border-radius:14px; padding:12px; margin-bottom:14px; }
    .live-tag { background:var(--red); color:#fff; font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block; margin-bottom:8px; }
    .stream-row { background:rgba(10,15,28,0.8); border-radius:10px; padding:10px; margin-top:6px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .watch-btn { background:var(--red); color:#fff; border:none; padding:7px 12px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .cd-box { background:rgba(56,189,248,0.15); color:var(--blue); padding:5px 9px; border-radius:8px; font-size:11px; font-weight:700; white-space:nowrap; }
    .strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px; }
    .mini-card { min-width:240px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px; cursor:pointer; flex-shrink:0; }
    .filters { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; }
    .pill { padding:6px 14px; border-radius:20px; background:var(--surface); color:var(--muted); font-size:12px; font-weight:700; border:1px solid var(--border); cursor:pointer; white-space:nowrap; }
    .pill.active { background:var(--blue); color:#000; }
    .match-card { background:var(--card); border-radius:14px; padding:13px; margin-bottom:10px; border:1px solid var(--border); cursor:pointer; }
    .m-top { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:8px; }
    .badge { padding:2px 8px; border-radius:6px; font-weight:700; font-size:10px; }
    .b-live { background:rgba(255,59,92,0.2); color:var(--red); }
    .b-up { background:rgba(56,189,248,0.2); color:var(--blue); }
    .b-res { background:rgba(0,230,118,0.15); color:var(--green); }
    .t-row { display:flex; justify-content:space-between; align-items:center; margin:6px 0; font-size:15px; font-weight:700; }
    .t-left { display:flex; align-items:center; gap:8px; }
    .t-img { width:24px; height:24px; border-radius:50%; object-fit:cover; background:#1e293b; }
    .m-status { font-size:12px; color:var(--gold); margin-top:8px; padding-top:7px; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; }
    .full-modal { position:fixed; inset:0; background:var(--bg); z-index:1000; display:none; flex-direction:column; overflow-y:auto; }
    .modal-head { background:var(--surface); padding:12px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
    .back-btn { background:#1e293b; color:var(--green); border:1px solid var(--green); padding:5px 12px; border-radius:8px; font-weight:700; cursor:pointer; }
    .sub-tabs { display:flex; background:#0b101d; border-bottom:1px solid var(--border); position:sticky; top:53px; z-index:9; }
    .sub-tab { flex:1; padding:10px 6px; text-align:center; font-size:12px; font-weight:700; color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; }
    .sub-tab.active { color:var(--green); border-bottom-color:var(--green); }
    .modal-body { padding:14px; max-width:780px; margin:0 auto; width:100%; padding-bottom:80px; }
    .inning-box { background:var(--card); border-radius:12px; border:1px solid var(--border); margin-bottom:12px; overflow:hidden; }

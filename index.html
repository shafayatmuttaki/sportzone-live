<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportZone Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; font-family:sans-serif; }
    body { background:#070b14; color:#fff; padding-bottom:65px; }
    header { background:#0f172a; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; position:sticky; top:0; z-index:10; }
    .lang-group { display:flex; gap:5px; }
    .lbtn { background:#1e293b; color:#38bdf8; border:1px solid #38bdf8; padding:4px 9px; border-radius:12px; font-size:11px; font-weight:bold; cursor:pointer; }
    .lbtn.active { background:#00e676; color:#000; border-color:#00e676; }
    .nav { display:flex; background:#0f172a; padding:8px; gap:8px; position:sticky; top:48px; z-index:9; }
    .nav button { flex:1; padding:10px; border:none; border-radius:8px; background:#1e293b; color:#94a3b8; font-weight:bold; cursor:pointer; }
    .nav button.active { background:#00e676; color:#000; }
    .wrap { padding:14px; max-width:700px; margin:auto; }
    .sec { display:none; }
    .sec.active { display:block; }
    .card { background:#151f34; border:1px solid #263554; border-radius:12px; padding:14px; margin-bottom:12px; cursor:pointer; }
    .row { display:flex; justify-content:space-between; margin:6px 0; font-size:16px; font-weight:bold; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .pbox { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; margin-bottom:12px; }
    video, iframe { width:100%; height:100%; border:none; }
    #ad { position:absolute; inset:0; background:#070b14; display:none; flex-direction:column; justify-content:center; align-items:center; z-index:20; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:999; display:none; justify-content:center; align-items:flex-start; overflow-y:auto; padding:20px; }
    .box { background:#131c31; border:2px solid #00e676; border-radius:16px; padding:20px; width:100%; max-width:600px; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
    th, td { padding:7px; border-bottom:1px solid #263554; text-align:left; }
    th { color:#38bdf8; }
    .adbar { position:fixed; bottom:0; left:0; right:0; height:50px; background:#0f172a; border-top:1px solid #263554; display:flex; justify-content:center; align-items:center; font-size:12px; color:#94a3b8; }
  </style>
</head>
<body>

  <div class="modal" id="dMod">
    <div class="box">
      <button onclick="document.getElementById('dMod').style.display='none'" style="background:#00e676;color:#000;border:none;padding:6px 14px;border-radius:6px;font-weight:bold;margin-bottom:10px;cursor:pointer;">← Back</button>
      <div id="dBody"></div>
    </div>
  </div>

  <header>
    <div style="font-size:18px;font-weight:bold;color:#00e676;">⚡ SportZone Pro</div>
    <div class="lang-group">
      <button class="lbtn active" id="le" onclick="setL('en',this)">EN</button>
      <button class="lbtn" id="lb" onclick="setL('bn',this)">বাংলা</button>
      <button class="lbtn" id="lh" onclick="setL('hi',this)">हिन्दी</button>
    </div>
  </header>

  <div class="nav">
    <button class="active" id="n1" onclick="tab('s1',this)">🏏 Matches</button>
    <button id="n2" onclick="tab('s2',this)">📺 Live TV</button>
    <button id="n3" onclick="tab('s3',this)">🎬 Videos</button>
  </div>

  <div class="wrap">
    <div id="s1" class="sec active"><div id="mList">Loading...</div></div>
    <div id="s2" class="sec">
      <div class="pbox">
        <div id="ad"><div style="border:1px dashed #00e676;padding:16px;border-radius:8px;color:#00e676;font-weight:bold;margin-bottom:8px;">SPONSORED AD (300x100)</div><div style="color:#00e676;">Starts in <span id="cnt">10</span>s...</div></div>
        <video id="vid" controls playsinline></video>
      </div>
      <div id="tvMsg" style="color:#00e676;font-size:13px;margin-bottom:10px;">Select any channel below:</div>
      <div class="grid" id="tvGrid"></div>
    </div>
    <div id="s3" class="sec">
      <div class="pbox"><iframe src="https://www.youtube.com/embed/live_stream?channel=UCt2jxGk2fw704_7yX20r-2w" allowfullscreen></iframe></div>
    </div>
  </div>

  <div class="adbar">[ Banner Ad Space: 320x50 ]</div>

  <script>
    const KEY = "25d6a156-f7a3-4f24-8985-6a08f1e96202";
    const txt = {
      en: { n1:"🏏 Matches", n2:"📺 Live TV", n3:"🎬 Videos", sc:"Scorecard ➔" },
      bn: { n1:"🏏 ম্যাচসমূহ", n2:"📺 লাইভ টিভি", n3:"🎬 ভিডিও", sc:"স্কোরকার্ড ➔" },
      hi: { n1:"🏏 मैच", n2:"📺 लाइव टीवी", n3:"🎬 वीडियो", sc:"स्कोरकार्ड ➔" }
    };
    let lang = 'en';
    function setL(l, b) {
      lang = l;
      document.querySelectorAll('.lbtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const t = txt[l];
      document.getElementById('n1').innerText = t.n1;
      document.getElementById('n2').innerText = t.n2;
      document.getElementById('n3').innerText = t.n3;
      render();
    }

    let list = [
      { id:"1", name:"Bangladesh vs India, 1st T20I", status:"Bangladesh won by 6 wickets", venue:"Mirpur Stadium, Dhaka", teams:["Bangladesh","India"], score:[{r:178,w:4,o:19.2},{r:174,w:7,o:20}] },
      { id:"2", name:"Australia vs England, 2nd ODI", status:"Australia need 42 runs", venue:"MCG, Melbourne", teams:["Australia","England"], score:[{r:245,w:5,o:44},{r:286,w:8,o:50}] }
    ];

    async function load() {
      render();
      try {
        const r = await fetch('./scores.json?v=' + Date.now());
        if (r.ok) { const j = await r.json(); if (j && j.data && j.data.length) { list = j.data; render(); } }
      } catch(e) {}
    }

    function render() {
      const t = txt[lang] || txt.en;
      document.getElementById('mList').innerHTML = list.map((m, i) => {
        const s1 = m.score && m.score[0] ? `${m.score[0].r}/${m.score[0].w} (${m.score[0].o})` : '-';
        const s2 = m.score && m.score[1] ? `${m.score[1].r}/${m.score[1].w} (${m.score[1].o})` : '-';
        return `<div class="card" onclick="detail(${i})">
          <div style="font-size:11px;color:#00e676;font-weight:bold;">● LIVE / RECENT</div>
          <div class="row"><span>${m.teams[0]||'Team 1'}</span><span>${s1}</span></div>
          <div class="row"><span>${m.teams[1]||'Team 2'}</span><span>${s2}</span></div>
          <div style="font-size:12px;color:#fbbf24;margin-top:6px;display:flex;justify-content:space-between;"><span>${m.status}</span><span style="color:#00e676;">${t.sc}</span></div>
        </div>`;
      }).join('');
    }

    async function detail(i) {
      const m = list[i];
      document.getElementById('dMod').style.display = 'flex';
      document.getElementById('dBody').innerHTML = `<h3 style="color:#00e676;">${m.name}</h3><p style="color:#fbbf24;font-size:13px;margin:6px 0;">${m.status}</p><p style="color:#94a3b8;font-size:12px;">🏟️ ${m.venue||'N/A'}</p><div id="scArea" style="margin-top:12px;">Loading scorecard...</div>`;
      try {
        const r = await fetch(`https://api.cricapi.com/v1/match_scorecard?apikey=${KEY}&id=${m.id}`);
        const j = await r.json();
        if (j.status === 'success' && j.data && j.data.scorecard && j.data.scorecard.length) {
          document.getElementById('scArea').innerHTML = j.data.scorecard.map(inn => `<h4 style="color:#38bdf8;margin-top:10px;">${inn.inning}</h4><table><tr><th>Batsman</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>${(inn.batting||[]).map(b=>`<tr><td>${b.batsman.name}</td><td>${b.r}</td><td>${b.b}</td><td>${b['4s']}</td><td>${b['6s']}</td></tr>`).join('')}</table>`).join('');
        } else { document.getElementById('scArea').innerHTML = `<p style="font-size:13px;color:#94a3b8;">Scorecard updates live during match.</p>`; }
      } catch(e) {}
    }

    const tvs = [
      { name:"Red Bull TV (Sports)", url:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8" },
      { name:"FIFA+ Live Football", url:"https://a62dad94.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWV1X0ZJRkFQbHVzRW5nbGlzaF9ITFM/playlist.m3u8" },
      { name:"Dubai Sports 1", url:"https://dmisxthvll.cdn.mgmlcdn.com/dubaisports/smil:dubaisports.stream.smil/playlist.m3u8" },
      { name:"Dubai Sports 2", url:"https://dmisxthvll.cdn.mgmlcdn.com/dubaisports2/smil:dubaisports2.stream.smil/playlist.m3u8" }
    ];
    document.getElementById('tvGrid').innerHTML = tvs.map((c,i)=>`<div class="card" onclick="playTv(${i})"><div style="font-size:11px;color:#00e676;">● LIVE TV</div><div style="font-weight:bold;margin-top:4px;">${c.name}</div></div>`).join('');

    let hls=null, tm=null;
    function playTv(i) {
      const c = tvs[i], ad = document.getElementById('ad'), cnt = document.getElementById('cnt'), v = document.getElementById('vid');
      document.getElementById('tvMsg').innerText = "Loading: " + c.name;
      v.pause(); clearInterval(tm);
      let s = 10; cnt.innerText = s; ad.style.display = 'flex';
      tm = setInterval(() => {
        s--; cnt.innerText = s;
        if (s <= 0) {
          clearInterval(tm); ad.style.display = 'none';
          document.getElementById('tvMsg').innerText = "▶️ Live: " + c.name;
          if (Hls.isSupported()) { if(hls)hls.destroy(); hls=new Hls(); hls.loadSource(c.url); hls.attachMedia(v); hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play()); }
          else { v.src=c.url; v.play(); }
        }
      }, 1000);
    }

    function tab(id, b) {
      document.querySelectorAll('.sec').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
      document.getElementById(id).classList.add('active'); b.classList.add('active');
    }
    load();
  </script>
</body>
</html>
